services:
  vllm:
    image: vllm/vllm-openai:latest
    command: ["--model", "<your-model-id>"]
    ports: ["8000:8000"]
  gateway:
    build: ./gateway
    ports: ["8080:8080"]
    depends_on: [vllm]
  prometheus:
    image: prom/prometheus
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
